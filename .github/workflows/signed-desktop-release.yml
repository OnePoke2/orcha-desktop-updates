name: Signed Orcha Desktop release
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "SemVer tag (v1.0.0)"
        required: true
        type: string
permissions: { contents: write, pages: write, id-token: write }
concurrency:
  group: signed-desktop-release-${{ inputs.tag }}
  cancel-in-progress: false
env:
  ORCHA_DESKTOP_APP_URL: ${{ vars.ORCHA_DESKTOP_APP_URL }}
  ORCHA_DESKTOP_UPDATE_FEED_URL: ${{ vars.ORCHA_DESKTOP_UPDATE_FEED_URL }}
  ORCHA_DESKTOP_UPDATE_FEED_MODE: static
  ORCHA_DESKTOP_UPDATE_PUBLIC_BASE_URL: https://onepoke2.github.io/orcha-desktop-updates/updates
  ORCHA_SOURCE_ARCHIVE_URL: https://api.github.com/repos/OnePoke2/orcha-desktop/contents/Orcha-Desktop-source-1.0.0.zip
jobs:
  windows:
    runs-on: windows-latest
    env:
      ORCHA_SOURCE_READ_TOKEN: ${{ secrets.ORCHA_SOURCE_READ_TOKEN }}
      WINDOWS_CERTIFICATE_BASE64: ${{ secrets.WINDOWS_CERTIFICATE_BASE64 }}
      WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 10.4.1 }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - shell: pwsh
        run: |
          $keys=@('ORCHA_DESKTOP_APP_URL','ORCHA_DESKTOP_UPDATE_FEED_URL','ORCHA_SOURCE_READ_TOKEN','WINDOWS_CERTIFICATE_BASE64','WINDOWS_CERTIFICATE_PASSWORD'); $missing=$keys|?{[string]::IsNullOrWhiteSpace([Environment]::GetEnvironmentVariable($_))}; if($missing){throw "Missing: $($missing -join ', ')"}
          Invoke-WebRequest -Headers @{Authorization="Bearer $env:ORCHA_SOURCE_READ_TOKEN"; Accept="application/vnd.github.raw+json"} -Uri $env:ORCHA_SOURCE_ARCHIVE_URL -OutFile source.zip; Expand-Archive source.zip source
          $bytes=[Convert]::FromBase64String($env:WINDOWS_CERTIFICATE_BASE64); $cert="$env:RUNNER_TEMP/orcha.pfx"; [IO.File]::WriteAllBytes($cert,$bytes); "WINDOWS_CERTIFICATE_FILE=$cert"|Out-File $env:GITHUB_ENV -Append -Encoding utf8
      - working-directory: source
        run: pnpm install --frozen-lockfile
      - working-directory: source
        run: node scripts/write-desktop-release-config.mjs && pnpm desktop:make:win && pnpm desktop:make:win:arm64
      - uses: actions/upload-artifact@v4
        with: { name: windows-make-output, path: source/out/make, if-no-files-found: error }
  macos:
    runs-on: macos-14
    env:
      ORCHA_SOURCE_READ_TOKEN: ${{ secrets.ORCHA_SOURCE_READ_TOKEN }}
      APPLE_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
      APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
      APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
      APPLE_API_KEY_BASE64: ${{ secrets.APPLE_API_KEY_BASE64 }}
      APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
      APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 10.4.1 }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: |
          for key in ORCHA_DESKTOP_APP_URL ORCHA_DESKTOP_UPDATE_FEED_URL ORCHA_SOURCE_READ_TOKEN APPLE_CERTIFICATE_BASE64 APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY APPLE_API_KEY_BASE64 APPLE_API_KEY_ID APPLE_API_ISSUER; do test -n "${!key}" || { echo "Missing: $key" >&2; exit 1; }; done
          curl --fail -L -H "Authorization: Bearer $ORCHA_SOURCE_READ_TOKEN" -H "Accept: application/vnd.github.raw+json" "$ORCHA_SOURCE_ARCHIVE_URL" -o source.zip; unzip -q source.zip -d source
          cert="$RUNNER_TEMP/orcha.p12"; keychain="$RUNNER_TEMP/orcha.keychain-db"; password="$(uuidgen)"; echo "$APPLE_CERTIFICATE_BASE64"|base64 --decode > "$cert"; security create-keychain -p "$password" "$keychain"; security unlock-keychain -p "$password" "$keychain"; security import "$cert" -k "$keychain" -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign; security list-keychain -d user -s "$keychain"; security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$password" "$keychain"
          key="$RUNNER_TEMP/AuthKey_${APPLE_API_KEY_ID}.p8"; echo "$APPLE_API_KEY_BASE64"|base64 --decode > "$key"; echo "APPLE_API_KEY=$key" >> "$GITHUB_ENV"
      - working-directory: source
        run: pnpm install --frozen-lockfile
      - working-directory: source
        run: node scripts/write-desktop-release-config.mjs && pnpm desktop:make:mac:arm64 && pnpm desktop:make:mac:x64
      - uses: actions/upload-artifact@v4
        with: { name: macos-make-output, path: source/out/make, if-no-files-found: error }
  publish:
    needs: [windows, macos]
    runs-on: ubuntu-latest
    env: { GH_TOKEN: "${{ github.token }}" }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { path: artifacts }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: node scripts/prepare-update-site.mjs artifacts "${{ inputs.tag }}"
      - run: find release-assets -type f -print0|sort -z|xargs -0 sha256sum > SHA256SUMS.txt && gh release create "${{ inputs.tag }}" release-assets/* SHA256SUMS.txt --repo "$GITHUB_REPOSITORY" --title "Orcha Desktop ${{ inputs.tag }}" --generate-notes
      - uses: actions/upload-pages-artifact@v3
        with: { path: site }
      - uses: actions/deploy-pages@v4
